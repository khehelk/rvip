version: "3.8"
name: rviplabs
services:

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: main-service-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  main-service:
    image: rviplabs-main-service
    build:
      context: ../
      dockerfile: main-service/Dockerfile
    environment:
      JDBC_PASSWORD: ${MAIN_SERVICE_JDBC_PASSWORD}
      JDBC_URL: ${MAIN_SERVICE_JDBC_URL}
      JDBC_USERNAME: ${MAIN_SERVICE_JDBC_USERNAME}
      SERVER_PORT: ${MAIN_SERVICE_SERVER_PORT}
      REPORT_SERVICE_SERVER_URL: ${REPORT_SERVICE_SERVER_URL}
      GATEWAY_SERVER_URL: ${GATEWAY_SERVER_EXTERNAL_URL}
      FILE_SERVICE_SERVER_URL: ${FILE_SERVICE_SERVER_URL}
    depends_on:
      - postgres

  report-service:
    image: rviplabs-report-service
    build:
      context: ../
      dockerfile: report-service/Dockerfile
    environment:
      JDBC_PASSWORD: ${REPORT_SERVICE_JDBC_PASSWORD}
      JDBC_URL: ${REPORT_SERVICE_JDBC_URL}
      JDBC_USERNAME: ${REPORT_SERVICE_JDBC_USERNAME}
      SERVER_PORT: ${REPORT_SERVICE_SERVER_PORT}
      GATEWAY_SERVER_URL: ${GATEWAY_SERVER_EXTERNAL_URL}
    depends_on:
      - postgres

  gateway:
    image: rviplabs-gateway
    ports:
      - "${GATEWAY_SERVER_PORT}:${GATEWAY_SERVER_PORT}"
    build:
      context: ../
      dockerfile: gateway/Dockerfile
    environment:
      MAIN_SERVICE_SERVER_URL: ${MAIN_SERVICE_SERVER_URL}
      REPORT_SERVICE_SERVER_URL: ${REPORT_SERVICE_SERVER_URL}
      SERVER_PORT: ${GATEWAY_SERVER_PORT}
    depends_on:
      - main-service
      - report-service

  file-service:
    image: rviplabs-file
    ports:
      - "${FILE_SERVICE_SERVER_PORT}:${FILE_SERVICE_SERVER_PORT}"
    build:
      context: ../
      dockerfile: file-service/Dockerfile
    environment:
      SERVER_PORT: ${FILE_SERVICE_SERVER_PORT}
      MINIO_URL: ${MINIO_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
      - ./config/minio:/root/.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"