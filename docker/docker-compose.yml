version: "3.8"
name: rviplabs
services:

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: main-service-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  main-service:
    image: rviplabs-main-service
    build:
      context: ../
      dockerfile: main-service/Dockerfile
    environment:
      JDBC_PASSWORD: ${MAIN_SERVICE_JDBC_PASSWORD}
      JDBC_URL: ${MAIN_SERVICE_JDBC_URL}
      JDBC_USERNAME: ${MAIN_SERVICE_JDBC_USERNAME}
      SERVER_PORT: ${MAIN_SERVICE_SERVER_PORT}
      REPORT_SERVICE_SERVER_URL: ${REPORT_SERVICE_SERVER_URL}
      GATEWAY_SERVER_URL: ${GATEWAY_SERVER_EXTERNAL_URL}
      FILE_SERVICE_SERVER_URL: ${FILE_SERVICE_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER}
    depends_on:
      - postgres

  report-service:
    image: rviplabs-report-service
    build:
      context: ../
      dockerfile: report-service/Dockerfile
    environment:
      JDBC_PASSWORD: ${REPORT_SERVICE_JDBC_PASSWORD}
      JDBC_URL: ${REPORT_SERVICE_JDBC_URL}
      JDBC_USERNAME: ${REPORT_SERVICE_JDBC_USERNAME}
      SERVER_PORT: ${REPORT_SERVICE_SERVER_PORT}
      GATEWAY_SERVER_URL: ${GATEWAY_SERVER_EXTERNAL_URL}
    depends_on:
      - postgres

  gateway:
    image: rviplabs-gateway
    ports:
      - "${GATEWAY_SERVER_PORT}:${GATEWAY_SERVER_PORT}"
    build:
      context: ../
      dockerfile: gateway/Dockerfile
    environment:
      MAIN_SERVICE_SERVER_URL: ${MAIN_SERVICE_SERVER_URL}
      REPORT_SERVICE_SERVER_URL: ${REPORT_SERVICE_SERVER_URL}
      SERVER_PORT: ${GATEWAY_SERVER_PORT}
    depends_on:
      - main-service
      - report-service

  file-service:
    image: rviplabs-file
    ports:
      - "${FILE_SERVICE_SERVER_PORT}:${FILE_SERVICE_SERVER_PORT}"
    build:
      context: ../
      dockerfile: file-service/Dockerfile
    environment:
      SERVER_PORT: ${FILE_SERVICE_SERVER_PORT}
      MINIO_URL: ${MINIO_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER}

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
      - ./config/minio:/root/.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

volumes:
  kafka_data: