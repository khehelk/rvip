group = 'ru.khehelk.rviplabs.gateway'
version = '0.0.1-SNAPSHOT'

springBoot {
    mainClass = 'ru.khehelk.rviplabs.gateway.GatewayApplication'
    buildInfo()
}

dependencies {
    implementation project(':log-config')
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.3'
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdoc_version}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
